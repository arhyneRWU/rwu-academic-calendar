[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwu-academic-calendar"
version = "0.1.0"
description = "Unofficial machine-readable (ICS + JSON) Roger Williams University academic calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Upper bounds are deliberate. CI installs these with `issues: write`
# and Pages deploy rights, so an unbounded range means a compromised
# upstream release runs with those permissions unreviewed.
dependencies = ["icalendar>=6.0,<7", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rwu-calendar = "rwu_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
