[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwu-academic-calendar"
version = "0.1.0"
description = "Unofficial machine-readable (ICS + JSON) Roger Williams University academic calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["icalendar>=6.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rwu-calendar = "rwu_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestRemovedIn10Warning"]
